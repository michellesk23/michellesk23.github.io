<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS180: Project 0</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
            background-color: #fafafa;
        }
        header {
            margin-bottom: 30px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #0366d6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        section {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
        }
        h2 {
            margin-top: 0;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 8px;
            font-size: 1.4rem;
        }
        p {
            margin-top: 0;
        }
        .image-grid {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .image-grid figure {
            flex: 1;
            margin: 0;
        }
        .single-media {
            margin-top: 15px;
            max-width: 600px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            border: 1px solid #eaecef;
        }
        figcaption {
            margin-top: 8px;
            font-size: 0.88rem;
            color: #586069;
            text-align: center;
        }
        @media (max-width: 600px) {
            .image-grid {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-link">&larr; Back to Portfolio</a>
        <h1>Project 0</h1>
    </header>

    <section>
        <h2>Part 1: Selfie: The Wrong Way vs. The Right Way </h2>
        <div class="image-grid">
            <figure>
                <img src="./media/part1_img1.jpeg" alt="">
                <figcaption>Close Up Image</figcaption>
            </figure>
            <figure>
                <img src="./media/part1_img2.jpeg" alt="">
                <figcaption>Zoomed In Image</figcaption>
            </figure>
        </div>
    </section>

    <section>
        <h2>Part 2: Architectural Perspective Compression</h2>
        <div class="image-grid">
            <figure>
                <img src="./media/part2_img1.jpeg" alt="">
                <figcaption>Zoomed In Image, Flattened</figcaption>
            </figure>
            <figure>
                <img src="./media/part2_img2.jpeg" alt="">
                <figcaption>Close Up Image</figcaption>
            </figure>
        </div>
    </section>

    <section>
        <h2>Part 3: Dolly Zoom</h2>
        <figure class="single-media">
            <img src="./media/part3_animation.gif" alt="">
            <figcaption>Figure 5: Animation</figcaption>
        </figure>
    </section>

</body>
</html>
