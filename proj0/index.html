<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS180: Project 0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
            background-color: #fae3f1;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0366d6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 1.35rem;
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 6px;
        }
        

        .row {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .row figure {
            flex: 1;
            margin: 0;
        }


        .single-media {
            margin: 20px auto;
            max-width: 500px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
        figcaption {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #586069;
            text-align: center;
        }


        @media (max-width: 600px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">&larr; Back to Portfolio</a>
    <h1>Project 0: Becoming Friends with Images</h1>

    <h2>Part 1: Selfie: The Wrong Way vs. The Right Way</h2>
    <div class="row">
        <figure>
            <img src="./media/part1_img1.jpeg" alt="">
            <figcaption>Close Up Image</figcaption>
        </figure>
        <figure>
            <img src="./media/part1_img2.jpeg" alt="">
            <figcaption>Zoomed In Image</figcaption>
        </figure>
    </div>

    <h2>Part 2: Architectural Perspective Compression</h2>
    <div class="row">
        <figure>
            <img src="./media/part2_img1.jpeg" alt="">
            <figcaption>Zoomed In Image, Flattened</figcaption>
        </figure>
        <figure>
            <img src="./media/part2_img2.jpeg" alt="">
            <figcaption>Close Up Image</figcaption>
        </figure>
    </div>

    <h2>Part 3: Dolly Zoom</h2>
    <figure class="single-media">
        <img src="./media/part3_animation.gif" alt="">
        <figcaption>Animation</figcaption>
    </figure>

</body>
</html>
