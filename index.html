    <style>

            margin: 0 auto;

        }

        }

        .title {
            font-size: 1.15em;
        }

        .projects a:hover .title {
            text-decoration: underline;
            text-decoration-color: #b04a85;
            text-underline-offset: 4px;
        }

        .projects a:hover {
            background-color: #f6d3e8;
        }

        @media (max-width: 600px) {
            body {
                font-size: 16px;
                padding: 36px 16px;
            }
            .projects a {
